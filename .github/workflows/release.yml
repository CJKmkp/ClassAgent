name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/plugin-build-net10.yml
    with:
      project: ClassAgent.csproj
      plugin_id: com.icc.class-agent
      plugin_name: ClassAgent
      plugin_description: '课堂 AI 助手：读取屏幕、自动讲题、结构化批注、辅助板书和智慧白板。'
      create_release: true
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
