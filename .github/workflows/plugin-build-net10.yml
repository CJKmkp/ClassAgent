name: ICC-CE Plugin Build (net10)

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      plugin_id:
        type: string
        required: true
      plugin_name:
        type: string
        required: false
        default: ""
      plugin_description:
        type: string
        required: false
        default: ""
      create_release:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
      auto_release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout ClassAgent
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout ICC-CE net10 host SDK
        uses: actions/checkout@v4
        with:
          repository: InkCanvasForClass/community
          ref: net10
          path: community

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build host SDK and controls
        shell: pwsh
        run: |
          dotnet restore "community/InkCanvas.PluginSdk/InkCanvas.PluginSdk.csproj"
          dotnet restore "community/InkCanvas.Controls/InkCanvas.Controls.csproj"
          dotnet build "community/InkCanvas.PluginSdk/InkCanvas.PluginSdk.csproj" -c Release --no-restore
          dotnet build "community/InkCanvas.Controls/InkCanvas.Controls.csproj" -c Release --no-restore

      - name: Restore plugin
        run: dotnet restore "plugin/${{ inputs.project }}" -p:HostRepoRoot=community

      - name: Build plugin
        run: dotnet build "plugin/${{ inputs.project }}" -c Release --no-restore -p:HostRepoRoot=community

      - name: Resolve plugin output
        id: outdir
        shell: pwsh
        run: |
          $csproj = "plugin/${{ inputs.project }}"
          $pluginRoot = Split-Path -Parent $csproj
          if (-not $pluginRoot) { $pluginRoot = "plugin" }
          [xml]$projectXml = Get-Content $csproj
          $assemblyName = @($projectXml.Project.PropertyGroup.AssemblyName | Where-Object { $_ })[0]
          if (-not $assemblyName) { $assemblyName = [IO.Path]::GetFileNameWithoutExtension($csproj) }
          $binRoot = Join-Path $pluginRoot "bin"
          $candidates = Get-ChildItem $binRoot -Recurse -File -Filter "$assemblyName.dll" |
            Where-Object {
              $_.FullName -match '[\\/]Release[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName "manifest.json"))
            } | Sort-Object LastWriteTimeUtc -Descending
          if (-not $candidates) { throw "找不到插件 Release 输出：$csproj" }
          "out_dir=$($candidates[0].Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: Validate and package icpx
        id: package
        shell: pwsh
        run: |
          $outDir = "${{ steps.outdir.outputs.out_dir }}"
          $manifestPath = Join-Path $outDir "manifest.json"
          $manifest = Get-Content $manifestPath | ConvertFrom-Json
          if ($manifest.Id -ne "${{ inputs.plugin_id }}") { throw "manifest Id 与 workflow plugin_id 不一致" }
          $entrance = $manifest.EntranceAssembly
          $deps = $entrance -replace '\.dll$', '.deps.json'
          foreach ($file in @($entrance, $deps)) {
            if (-not (Test-Path (Join-Path $outDir $file))) { throw "缺少插件产物：$file" }
          }

          $staging = Join-Path $env:RUNNER_TEMP "icpx_$($manifest.Id)"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $manifestPath (Join-Path $staging "manifest.json")
          Copy-Item (Join-Path $outDir $entrance) (Join-Path $staging $entrance)
          Copy-Item (Join-Path $outDir $deps) (Join-Path $staging $deps)
          $icon = Join-Path $outDir "icon.png"
          if (Test-Path $icon) { Copy-Item $icon (Join-Path $staging "icon.png") }

          $icpxName = "${{ inputs.plugin_id }}.icpx"
          $icpxPath = Join-Path $env:GITHUB_WORKSPACE $icpxName
          if (Test-Path $icpxPath) { Remove-Item $icpxPath -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $icpxPath)
          $zip = [System.IO.Compression.ZipFile]::OpenRead($icpxPath)
          try { $entries = @($zip.Entries | ForEach-Object { $_.FullName }) }
          finally { $zip.Dispose() }
          $expected = @("manifest.json", $entrance, $deps)
          if (Test-Path (Join-Path $staging "icon.png")) { $expected += "icon.png" }
          $unexpected = $entries | Where-Object { $_ -notin $expected }
          if ($unexpected) { throw "包内出现意外文件：$($unexpected -join ', ')" }
          $missing = $expected | Where-Object { $_ -notin $entries }
          if ($missing) { throw "包内缺少文件：$($missing -join ', ')" }
          $hash = (Get-FileHash $icpxPath -Algorithm SHA256).Hash.ToLower()
          "icpx_path=$icpxName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "version=$($manifest.Version)" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged $icpxName SHA256=$hash"

      - name: Upload icpx artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plugin_id }}
          path: ${{ steps.package.outputs.icpx_path }}
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag -and "${{ inputs.auto_release }}" -eq "true" -and
              "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $candidate = "v${{ steps.package.outputs.version }}"
            gh release view $candidate --repo "${{ github.repository }}" 2>$null | Out-Null
            $probeCode = $LASTEXITCODE
            $LASTEXITCODE = 0
            if ($probeCode -ne 0) { $tag = $candidate }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.plugin_name }} v${{ steps.package.outputs.version }}
          body: |
            ## ${{ inputs.plugin_id }} v${{ steps.package.outputs.version }}

            ${{ inputs.plugin_description }}

            安装：下载 `.icpx` 后放入 ICC-CE 的 `PluginPackages/` 目录并重启。

            SHA256: `${{ steps.package.outputs.sha256 }}`
          files: ${{ steps.package.outputs.icpx_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
